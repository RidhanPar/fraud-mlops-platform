# Full local stack: API, prediction log, drift monitor, Prometheus, Alertmanager, Grafana.
#   python -m fraud_mlops.export_model && docker compose up -d --build
# Grafana http://localhost:3000   Prometheus http://localhost:9090   Alertmanager http://localhost:9093

# Local demo credentials only. A real deployment reads these from a secrets manager.
x-app-env: &app-env
  # Services connect as fraud_app: INSERT and SELECT only, no UPDATE, DELETE or DDL.
  DATABASE_URL: postgresql+psycopg://fraud_app:app_local_only@postgres:5432/fraud
  MODEL_DIR: /app/serving_model

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud          # admin: owns the schema, used only by the migration job
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    volumes: [pgdata:/var/lib/postgresql/data]
    # Loopback only, for audit tooling (verify, explain_cli) run from the host.
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 5s
      retries: 20

  migrate:
    image: fraud-detector:v1
    command: ["python", "-m", "fraud_mlops.audit.migrate"]
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://fraud:fraud@postgres:5432/fraud
      APP_DB_PASSWORD: app_local_only
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    image: fraud-detector:v1
    environment:
      <<: *app-env
      WORKERS: "2"
    ports: ["8000:8000"]
    cpus: 2
    depends_on:
      migrate: {condition: service_completed_successfully}

  auditor:
    image: fraud-detector:v1
    command: ["sh", "-c", "unset PROMETHEUS_MULTIPROC_DIR && exec python -m fraud_mlops.audit.seal --loop"]
    environment:
      <<: *app-env
      SEAL_INTERVAL_SECONDS: "30"
    healthcheck:
      disable: true
    depends_on:
      migrate: {condition: service_completed_successfully}

  monitor:
    image: fraud-detector:v1
    # Single process, so it must not inherit the API's multiprocess metrics mode.
    command: ["sh", "-c", "unset PROMETHEUS_MULTIPROC_DIR && exec python -m fraud_mlops.monitoring.monitor"]
    environment:
      <<: *app-env
      MONITOR_INTERVAL_SECONDS: "15"
    healthcheck:
      disable: true
    depends_on:
      api: {condition: service_healthy}

  alert-sink:
    image: fraud-detector:v1
    command: ["python", "-m", "fraud_mlops.monitoring.alert_sink"]
    user: root
    environment:
      ALERT_LOG: /data/alerts.jsonl
    volumes: ["./monitoring/alert_log:/data"]
    healthcheck:
      disable: true

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fraud.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  pgdata:
