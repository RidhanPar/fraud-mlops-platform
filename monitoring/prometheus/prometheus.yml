global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fraud-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: drift-monitor
    static_configs:
      - targets: ["monitor:9100"]
